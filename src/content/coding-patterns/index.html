            display: flex;

            border-radius: 6px;
            font-size: 14px;

            background: #f0f0f0;
        }

        .folder-header.active {
            background: #e3f2fd;
            color: #1976d2;
        }

        .folder-icon {
            margin-right: 8px;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .folder.open .folder-icon {

        }

        .folder-content {
            display: none;
            margin-left: 20px;
            margin-top: 5px;
        }

        .folder.open .folder-content {
            display: block;
        }

        .file-item {
            padding: 6px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-radius: 6px;
            font-size: 13px;
            color: #555;
            transition: background 0.2s;
            margin-bottom: 2px;
        }

        .file-item:hover {
            background: #f5f5f5;
        }

        .file-item.active {
            background: #3498db;
            color: white;
        }

        .file-icon {
            margin-right: 8px;
            font-size: 14px;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 15px 20px;
            background: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .content-header h2 {
            font-size: 16px;
            color: #2c3e50;
            font-weight: 600;
        }

        .breadcrumb {
            font-size: 12px;
            color: #777;
            margin-top: 4px;
        }

        .content-body {
            flex: 1;
            overflow: auto;
            background: white;
        }

        .content-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        .welcome-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #999;
        }

        .welcome-screen div {
            max-width: 400px;
        }

        .welcome-screen h3 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #666;
        }

        .welcome-screen p {
            font-size: 14px;
            line-height: 1.6;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: -320px;
                z-index: 1000;
                transition: left 0.3s;
                box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            }

            .sidebar.mobile-open {
                left: 0;
            }

            .mobile-toggle {
                display: block;
                padding: 10px;
                background: #3498db;
                color: white;
                border: none;
                cursor: pointer;
            }
        }

        .mobile-toggle {

        let currentFile = null;

        function buildFileTree(structure, container, parentPath = '') {
            for (const [name, content] of Object.entries(structure)) {
                const path = parentPath ? `${parentPath}/${name}` : name;
                
                if (content.folders || content.files) {
                    // This is a folder
                    const folderDiv = document.createElement('div');
                    folderDiv.className = 'folder';
                    
                    const folderHeader = document.createElement('div');
                    folderHeader.className = 'folder-header';
                    folderHeader.innerHTML = `<span class="folder-icon">▶</span><span>${name}</span>`;
                    
                    const folderContent = document.createElement('div');
                    folderContent.className = 'folder-content';
                    
                    folderHeader.onclick = () => {
                        folderDiv.classList.toggle('open');
                    };
                    
                    folderDiv.appendChild(folderHeader);
                    folderDiv.appendChild(folderContent);
                    container.appendChild(folderDiv);
                    
                    // Add subfolders
                    if (content.folders) {
                        buildFileTree(content.folders, folderContent, path);
                    }
                    
                    // Add files
                    if (content.files) {
                        content.files.forEach(file => {
                            const fileItem = document.createElement('div');
                            fileItem.className = 'file-item';
                            fileItem.innerHTML = `<span class="file-icon">📄</span><span>${file}</span>`;
                            fileItem.onclick = () => loadFile(path, file, fileItem);
                            folderContent.appendChild(fileItem);
                        });
                    }
                }
            }
        }

        async function loadFile(folderPath, fileName, element) {
            // Remove active class from all files
            document.querySelectorAll('.file-item').forEach(item => {
                item.classList.remove('active');
            });
            
            // Add active class to clicked file
            element.classList.add('active');
            
            // Update header
            document.getElementById('contentTitle').textContent = fileName;
            document.getElementById('breadcrumb').textContent = folderPath;
            
            // Show loading
            const contentBody = document.getElementById('contentBody');
            contentBody.innerHTML = '<div class="loading">Loading...</div>';
            
            // Construct file path - ADJUST THIS to match your actual file structure
            const filePath = `${folderPath}/${fileName}`;
            
            try {
                // Fetch the HTML file
                const response = await fetch(filePath);
                
                if (!response.ok) {
                    throw new Error('File not found');
                }
                
                const htmlContent = await response.text();
                
                // Create a wrapper and inject the HTML
                contentBody.innerHTML = `<div class="content-wrapper">${htmlContent}</div>`;
                
                // Execute any scripts in the loaded HTML
                const scripts = contentBody.querySelectorAll('script');
                scripts.forEach(script => {
                    const newScript = document.createElement('script');
                    newScript.textContent = script.textContent;
                    document.body.appendChild(newScript);
                });
                
            } catch (error) {
                contentBody.innerHTML = `
                    <div class="welcome-screen">
                        <div>
                            <h3>❌ Error Loading File</h3>
                            <p>Could not load: ${filePath}</p>
                            <p style="margin-top: 10px; font-size: 12px; color: #999;">
                                Make sure the file path is correct and the file exists.
                            </p>
                        </div>
                    </div>
                `;
            }
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const fileItems = document.querySelectorAll('.file-item');
            
            fileItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                const folder = item.closest('.folder');
                
                if (text.includes(searchTerm)) {
                    item.style.display = 'flex';
                    // Open parent folder
                    if (folder) {
                        folder.classList.add('open');
                    }
                } else {
                    item.style.display = 'none';
                }
            });
            
            // Hide empty folders
            document.querySelectorAll('.folder').forEach(folder => {
                const visibleFiles = folder.querySelectorAll('.file-item[style="display: flex;"]');
                if (searchTerm && visibleFiles.length === 0) {
                    folder.style.display = 'none';
                } else {
                    folder.style.display = 'block';
                }
            });
        });
